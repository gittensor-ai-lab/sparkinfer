name: eval-policy

on:
  pull_request:
    paths:
      - "bench/scripts/**"
      - "eval/**"
      - ".github/workflows/eval-policy.yml"
      - ".github/workflows/rtx5090-required.yml"
      - ".github/workflows/close-stale-prs.yml"
      - ".github/workflows/noise-penalty.yml"
  push:
    branches: [main]
    paths:
      - "bench/scripts/**"
      - "eval/**"
      - ".github/workflows/eval-policy.yml"
      - ".github/workflows/rtx5090-required.yml"
      - ".github/workflows/close-stale-prs.yml"
      - ".github/workflows/noise-penalty.yml"

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          set -euo pipefail
          bash -n bench/scripts/evaluate.sh
          bash -n bench/scripts/warm_llamacpp.sh
          bash -n eval/run_bot_cron.sh
          bash -n eval/setup_labels.sh
          # The wrappers cron actually runs (eval/README.md): a syntax error in one silently stops
          # that bot's scoring.
          bash -n eval/run_qwen38_cron.sh
          bash -n eval/run_museglimmer_cron.sh
          bash -n eval/run_bonsai_pr_cron.sh
          bash -n eval/run_sync_cron.sh
          bash -n eval/cron_common.sh

      - name: Python syntax
        run: |
          set -euo pipefail
          python3 -m py_compile \
            bench/scripts/label.py \
            bench/scripts/test_label.py \
            eval/pr_eval_bot.py \
            eval/test_pr_eval_bot.py \
            eval/vast_eval.py \
            eval/pr_qwen38_bot.py \
            eval/test_pr_qwen38_bot.py \
            eval/pr_museglimmer_bot.py \
            eval/pr_bonsai_bot.py \
            eval/bonsai_regression.py \
            eval/test_pr_bonsai_bot.py \
            eval/test_sibling_bot_fixes.py \
            eval/test_cron_wrappers.py \
            eval/noise_penalty.py \
            eval/test_noise_penalty.py \
            bench/scripts/accuracy_compare_pair.py

      - name: Eval policy tests
        run: |
          set -euo pipefail
          python3 bench/scripts/test_label.py
          python3 eval/test_pr_eval_bot.py
          python3 eval/test_pr_qwen38_bot.py
          python3 eval/test_pr_bonsai_bot.py
          python3 eval/test_sibling_bot_fixes.py
          # The cron wrappers, run for real against a throwaway origin (no GitHub, no GPU box).
          python3 eval/test_cron_wrappers.py
          python3 eval/test_noise_penalty.py
          # The ban list itself is policy: a malformed line must fail review, not a 3am cron.
          python3 eval/noise_penalty.py --check
