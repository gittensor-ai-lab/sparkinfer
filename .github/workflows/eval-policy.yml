name: eval-policy

on:
  pull_request:
    paths:
      - "bench/scripts/**"
      - "eval/**"
      - ".github/workflows/eval-policy.yml"
      - ".github/workflows/rtx5090-required.yml"
      - ".github/workflows/close-stale-prs.yml"
      - ".github/workflows/noise-penalty.yml"
  push:
    branches: [main]
    paths:
      - "bench/scripts/**"
      - "eval/**"
      - ".github/workflows/eval-policy.yml"
      - ".github/workflows/rtx5090-required.yml"
      - ".github/workflows/close-stale-prs.yml"
      - ".github/workflows/noise-penalty.yml"

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          set -euo pipefail
          bash -n bench/scripts/evaluate.sh
          bash -n bench/scripts/warm_llamacpp.sh
          bash -n eval/run_bot_cron.sh
          bash -n eval/setup_labels.sh
          # Qwen3.8-27B is the scored model (eval/README.md); its cron wrapper is the one that
          # actually runs, so a syntax error here silently stops all scoring.
          bash -n eval/run_qwen38_cron.sh

      - name: Python syntax
        run: |
          set -euo pipefail
          python3 -m py_compile \
            bench/scripts/label.py \
            bench/scripts/test_label.py \
            eval/pr_eval_bot.py \
            eval/test_pr_eval_bot.py \
            eval/vast_eval.py \
            eval/pr_qwen38_bot.py \
            eval/test_pr_qwen38_bot.py \
            eval/noise_penalty.py \
            eval/test_noise_penalty.py \
            bench/scripts/accuracy_compare_pair.py

      - name: Eval policy tests
        run: |
          set -euo pipefail
          python3 bench/scripts/test_label.py
          python3 eval/test_pr_eval_bot.py
          python3 eval/test_pr_qwen38_bot.py
          python3 eval/test_noise_penalty.py
          # The ban list itself is policy: a malformed line must fail review, not a 3am cron.
          python3 eval/noise_penalty.py --check
